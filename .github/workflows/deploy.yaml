name: Upload DBT

on:
  workflow_dispatch:
    branches: [main, dev, stage, prod]
  push:
    branches: [main, dev, stage, prod]
    paths:
      - dbt/**
      - dags/**
      - glue/jobs/**
  pull_request:
    paths:
      - dbt/**
      - dags/**
      - glue/jobs/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v2.x
      - name: Set Variables
        run: |
          echo "AWS_S3_BUCKET_NAME=AWS_S3_BUCKET__${GITHUB_REF_SLUG}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID_NAME=AWS_ACCESS_KEY_ID__${GITHUB_REF_SLUG}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY_NAME=AWS_SECRET_ACCESS_KEY__${GITHUB_REF_SLUG}" >> $GITHUB_ENV        
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - uses: jakejarvis/s3-sync-action@master
        name: upload-dbt
        #      with:
        #        args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets[env.AWS_S3_BUCKET_NAME] }}
          AWS_ACCESS_KEY_ID: ${{ secrets[env.AWS_ACCESS_KEY_ID_NAME] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[env.AWS_SECRET_ACCESS_KEY_NAME] }}
          AWS_REGION: "us-east-1"
          SOURCE_DIR: "./dbt"
          DEST_DIR: "dags/${{ env.REPO_NAME }}/dbt"
      - name: Check folder existence
        id: check_files
        uses: andstor/file-existence-action@v2
        with:
          files: "./dags/"
      - uses: jakejarvis/s3-sync-action@master
        if: steps.check_files.outputs.files_exists == 'true'
        name: upload-dags
        #      with:
        #        args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets[env.AWS_S3_BUCKET_NAME] }}
          AWS_ACCESS_KEY_ID: ${{ secrets[env.AWS_ACCESS_KEY_ID_NAME] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[env.AWS_SECRET_ACCESS_KEY_NAME] }}
          AWS_REGION: "us-east-1"
          SOURCE_DIR: "./dags"
          DEST_DIR: "dags/${{ env.REPO_NAME }}"
      - uses: jakejarvis/s3-sync-action@master
        if: steps.check_files.outputs.files_exists == 'true'
        name: upload-glue-jobs
        #      with:
        #        args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets[env.AWS_S3_BUCKET_NAME] }}
          AWS_ACCESS_KEY_ID: ${{ secrets[env.AWS_ACCESS_KEY_ID_NAME] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[env.AWS_SECRET_ACCESS_KEY_NAME] }}
          AWS_REGION: "us-east-1"
          SOURCE_DIR: "./glue/jobs"
          DEST_DIR: "dags/${{ env.REPO_NAME }}/glue"
